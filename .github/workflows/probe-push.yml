name: probe-push
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name probe
          git config user.email probe@example.com
          git commit -q --allow-empty -m "ci: push from actions"
          git push origin HEAD:main
